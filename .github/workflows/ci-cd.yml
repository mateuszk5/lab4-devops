name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check syntax
        run: python -m py_compile app.py

      - name: Build Docker image
        run: docker build -t lab4-app .

  test:
    name: Test
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest -v

  deploy:
    name: Deploy to test environment
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Start application with docker compose
        run: docker compose up -d --build

      - name: Smoke test (health and database)
        run: |
          for i in $(seq 1 15); do
            if curl -fs http://localhost:5000/health && curl -fs http://localhost:5000/db; then
              echo "Deployment OK"
              exit 0
            fi
            echo "Waiting for application..."
            sleep 3
          done
          docker compose logs
          exit 1

      - name: Show running containers
        run: docker compose ps

      - name: Clean up
        if: always()
        run: docker compose down -v